<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | EventPass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body>
  <main class="container-fluid">
    <div class="row auth">
      <aside class="col-lg-5 auth-brand d-flex flex-column justify-content-between p-4 p-lg-5">
        <a href="index.html" class="brand">EventPass</a>
        <div>
          <h1>Tu entrada al próximo concierto</h1>
          <p>Compra boletos o publica tus eventos desde una sola cuenta.</p>
        </div>
      </aside>

      <section class="col-lg-7 d-flex align-items-center justify-content-center p-4">
        <div class="auth-panel w-100">
          <h2 class="mb-4">Inicia sesión</h2>
          <form id="form-login" novalidate>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" id="correo" class="form-control" autocomplete="email" required>
            </div>
            <div class="mb-3">
              <label for="clave" class="form-label">Contraseña</label>
              <input type="password" id="clave" class="form-control" autocomplete="current-password" required>
            </div>
            <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
            <button type="submit" class="btn btn-violet w-100">Iniciar sesión</button>
          </form>
          <p class="mt-4 mb-0">¿Aún no tienes cuenta? <a href="registro.html">Crea una</a></p>
        </div>
      </section>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
