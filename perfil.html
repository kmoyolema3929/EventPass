<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi perfil | EventPass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/perfil.css" rel="stylesheet">
</head>
<body>
  <header class="topbar d-flex justify-content-between align-items-center px-4 py-3">
    <a href="index.html" class="brand">EventPass</a>
    <button type="button" id="btn-salir" class="btn btn-outline-light btn-sm d-none">Cerrar sesión</button>
  </header>

  <main class="container py-5">
    <!-- Sin sesión -->
    <div id="sin-sesion" class="perfil-card text-center d-none">
      <h1 class="h4">Inicia sesión para ver tu perfil</h1>
      <p class="mb-4">Necesitas una cuenta para ver y editar tus datos.</p>
      <a href="login.html" class="btn btn-violet">Iniciar sesión</a>
    </div>

    <!-- Con sesión -->
    <div id="contenido" class="d-none">
      <div class="perfil-card d-flex align-items-center gap-3 mb-4">
        <div id="avatar" class="avatar" aria-hidden="true"></div>
        <div>
          <h1 id="nombre" class="h4 mb-1"></h1>
          <p id="correo" class="mb-1 text-muted"></p>
          <span id="rol" class="rol-badge"></span>
        </div>
      </div>

      <div id="aviso" class="alert alert-success d-none" role="status">Cambios guardados.</div>

      <!-- Vista comprador -->
      <form id="vista-comprador" class="perfil-card d-none" novalidate>
        <h2 class="h5 mb-3">Mis preferencias</h2>
        <div class="mb-3">
          <label for="ciudad" class="form-label">Ciudad</label>
          <input type="text" id="ciudad" class="form-control" placeholder="Ambato">
        </div>
        <fieldset class="mb-4">
          <legend class="form-label">Géneros que me gustan</legend>
          <div class="d-flex flex-wrap gap-2">
            <label class="chip"><input type="checkbox" class="visually-hidden" name="genero" value="Rock"><span>Rock</span></label>
            <label class="chip"><input type="checkbox" class="visually-hidden" name="genero" value="Pop"><span>Pop</span></label>
            <label class="chip"><input type="checkbox" class="visually-hidden" name="genero" value="Reguetón"><span>Reguetón</span></label>
            <label class="chip"><input type="checkbox" class="visually-hidden" name="genero" value="Electrónica"><span>Electrónica</span></label>
            <label class="chip"><input type="checkbox" class="visually-hidden" name="genero" value="Salsa"><span>Salsa</span></label>
            <label class="chip"><input type="checkbox" class="visually-hidden" name="genero" value="Clásica"><span>Clásica</span></label>
          </div>
        </fieldset>
        <button type="submit" class="btn btn-violet">Guardar preferencias</button>
      </form>

      <!-- Vista organizador -->
      <form id="vista-publicador" class="perfil-card d-none" novalidate>
        <h2 class="h5 mb-3">Datos de mi productora</h2>
        <div class="mb-3">
          <label for="productora" class="form-label">Nombre de la productora</label>
          <input type="text" id="productora" class="form-control">
        </div>
        <div class="mb-3">
          <label for="telefono" class="form-label">Teléfono de contacto</label>
          <input type="tel" id="telefono" class="form-control">
        </div>
        <div class="mb-4">
          <label for="descripcion" class="form-label">Descripción</label>
          <textarea id="descripcion" class="form-control" rows="4"></textarea>
        </div>
        <button type="submit" class="btn btn-violet">Guardar datos</button>
      </form>
    </div>
  </main>

  <script src="js/perfil.js"></script>
</body>
</html>
