<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crear cuenta | EventPass</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="css/auth.css" rel="stylesheet">
</head>
<body>
  <main class="container-fluid">
    <div class="row auth">
      <aside class="col-lg-5 auth-brand d-flex flex-column justify-content-between p-4 p-lg-5">
        <a href="index.html" class="brand">EventPass</a>
        <div>
          <h1>Crea tu cuenta en un minuto</h1>
          <p>Elige si vienes a disfrutar conciertos o a publicarlos.</p>
        </div>
      </aside>

      <section class="col-lg-7 d-flex align-items-center justify-content-center p-4">
        <div class="auth-panel w-100">
          <h2 class="mb-4">Crear cuenta</h2>
          <form id="form-registro" novalidate>
            <fieldset class="mb-4">
              <legend class="form-label">¿Qué quieres hacer?</legend>
              <div class="row g-3">
                <div class="col-sm-6 role-option">
                  <input type="radio" class="visually-hidden" name="rol" id="rol-comprador" value="comprador">
                  <label for="rol-comprador" class="role-card">Quiero comprar entradas</label>
                </div>
                <div class="col-sm-6 role-option">
                  <input type="radio" class="visually-hidden" name="rol" id="rol-publicador" value="publicador">
                  <label for="rol-publicador" class="role-card">Quiero publicar eventos</label>
                </div>
              </div>
            </fieldset>

            <div class="mb-3">
              <label for="nombre" class="form-label">Nombre completo</label>
              <input type="text" id="nombre" class="form-control" autocomplete="name" required>
            </div>
            <div class="mb-3 d-none" id="campo-productora">
              <label for="productora" class="form-label">Nombre de la productora</label>
              <input type="text" id="productora" class="form-control">
            </div>
            <div class="mb-3">
              <label for="correo" class="form-label">Correo electrónico</label>
              <input type="email" id="correo" class="form-control" autocomplete="email" required>
            </div>
            <div class="row g-3 mb-3">
              <div class="col-sm-6">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" id="clave" class="form-control" autocomplete="new-password" required>
              </div>
              <div class="col-sm-6">
                <label for="clave2" class="form-label">Repite la contraseña</label>
                <input type="password" id="clave2" class="form-control" autocomplete="new-password" required>
              </div>
            </div>

            <div id="alerta" class="alert alert-danger d-none" role="alert"></div>
            <button type="submit" class="btn btn-violet w-100">Crear cuenta</button>
          </form>
          <p class="mt-4 mb-0">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
        </div>
      </section>
    </div>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
