<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comprar Boletos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/boletos.css">
</head>
<body class="bg-light">

<div class="container mt-5 mb-5">
    <h2 class="mb-4 text-center" id="titulo-concierto">Selección de Entradas</h2>
    
    <div class="row">
        <!-- IZQUIERDA: Tipos de Boleto y Cantidad -->
        <div class="col-md-7">
            <h4 class="mb-3">1. Selecciona tus boletos</h4>
            <div id="contenedor-boletos"></div> 
        </div>

        <!-- DERECHA: Resumen del Carrito y Pago -->
        <div class="col-md-5">
            <h4 class="mb-3">2. Resumen de Compra</h4>
            <div class="card p-3 shadow-sm mb-4">
                <div id="detalle-carrito">
                    <p class="text-muted small">Tu carrito está vacío.</p>
                </div>
                <div class="d-flex justify-content-between mt-3 pt-3 border-top">
                    <h5 class="fw-bold">Total a Pagar:</h5>
                    <h5 class="fw-bold text-primary" id="total-carrito">$0.00</h5>
                </div>
            </div>
            
            <!-- Aquí irá tu formulario de pago para el PR 2 -->
            <button class="btn btn-success w-100 py-2">Ir a Pagar</button>
        </div>
    </div>
</div>

<script src="js/boletos.js"></script>
</body>
</html>
